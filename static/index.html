<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --error: #cf6679;
            --text-high: rgba(255, 255, 255, 0.87);
            --text-med: rgba(255, 255, 255, 0.60);
        }
        body {
            background-color: var(--bg);
            color: var(--text-high);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
        }
        h1 { text-align: center; color: var(--primary); }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--surface);
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background: var(--primary);
            color: black;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { opacity: 0.9; }
        .result {
            background: var(--surface);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .meta img {
            width: 200px;
            border-radius: 8px;
            object-fit: cover;
        }
        .info h2 { margin: 0 0 10px 0; font-size: 18px; }
        .info p { margin: 5px 0; color: var(--text-med); font-size: 14px; }
        
        .section-title {
            margin-top: 20px;
            margin-bottom: 10px;
            color: var(--secondary);
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }
        .format-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .format-btn {
            background: #2c2c2c;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid #333;
            transition: background 0.2s;
        }
        .format-btn:hover { background: #3c3c3c; }
        .res { font-weight: bold; font-size: 14px; color: var(--primary); }
        .ext { color: var(--text-med); text-transform: uppercase; }
        .size { color: var(--secondary); }

        .loading { text-align: center; display: none; margin-top: 20px; }
        .error { color: var(--error); text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube Downloader</h1>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="Paste YouTube URL here...">
            <button onclick="fetchInfo()">Get Video</button>
        </div>

        <div class="loading" id="loading">Loading...</div>
        <div class="error" id="error"></div>

        <div class="result" id="result">
            <div class="meta">
                <img id="thumb" src="" alt="Thumbnail">
                <div class="info">
                    <h2 id="title">Video Title</h2>
                    <p id="author">Channel Name</p>
                    <p id="duration">Duration</p>
                    <button onclick="streamAudio()" style="margin-top: 10px; background: var(--secondary);">Stream Audio Only</button>
                </div>
            </div>

            <div id="videoAudioSection">
                <div class="section-title">Video + Audio (Best for most users)</div>
                <div class="format-grid" id="vaGrid"></div>
            </div>

            <div id="videoOnlySection">
                <div class="section-title">Video Only (No Sound)</div>
                <div class="format-grid" id="voGrid"></div>
            </div>

            <div id="audioOnlySection">
                <div class="section-title">Audio Only</div>
                <div class="format-grid" id="aoGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function fetchInfo() {
            const url = document.getElementById('urlInput').value;
            if (!url) return;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('error').textContent = '';

            try {
                const res = await fetch(`${API_BASE}/info`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url})
                });

                if (!res.ok) throw new Error(await res.text());
                const data = await res.json();
                renderResult(data);
            } catch (err) {
                document.getElementById('error').textContent = err.message;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderResult(data) {
            document.getElementById('result').style.display = 'block';
            document.getElementById('thumb').src = data.thumbnail;
            document.getElementById('title').textContent = data.title;
            document.getElementById('author').textContent = data.uploader;
            document.getElementById('duration').textContent = `Duration: ${data.duration}s`;  // Could format nicely

            renderGrid('vaGrid', data.formats.video_audio, data.webpage_url);
            renderGrid('voGrid', data.formats.video_only, data.webpage_url);
            renderGrid('aoGrid', data.formats.audio_only, data.webpage_url);
        }

        function renderGrid(elementId, formats, videoUrl) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = '';
            if (!formats || formats.length === 0) {
                grid.innerHTML = '<p style="color: grey">None available</p>';
                return;
            }

            formats.forEach(fmt => {
                const a = document.createElement('a');
                a.className = 'format-btn';
                a.href = `${API_BASE}/download?url=${encodeURIComponent(videoUrl)}&format_id=${fmt.format_id}`;
                a.target = '_blank'; // Trigger download in new tab/stream

                let size = fmt.filesize_approx ? (fmt.filesize_approx / 1024 / 1024).toFixed(1) + ' MB' : 
                           fmt.filesize ? (fmt.filesize / 1024 / 1024).toFixed(1) + ' MB' : 'N/A';
                
                a.innerHTML = `
                    <span class="res">${fmt.resolution}</span>
                    <span class="ext">${fmt.ext}</span>
                    <span class="size">${size}</span>
                `;
                grid.appendChild(a);
            });
        }
        
        function streamAudio() {
             const url = document.getElementById('urlInput').value;
             window.open(`${API_BASE}/audio?url=${encodeURIComponent(url)}`, '_blank');
        }
    </script>
</body>
</html>
